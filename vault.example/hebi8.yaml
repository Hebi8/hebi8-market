# owner: [your-github-login]  # 写了就是局域网共用：列出的 GitHub 账号用这份 vault，其他人登录后各用 vault/users/<login>/
sync:
  at: ["07:30", "17:30"]       # 本地时间，按 tz 解释；美股收盘后、亚洲收盘后各一次
  tz: Asia/Tokyo
prices: split                  # split = 拆股复权（默认，和 TradingView 一致）；total = 含分红的总回报
periods: [1W, 1M, 1Y]          # 总览显示的涨跌周期，最多 4 个：1W 1M 3M YTD 1Y 3Y 5Y
updown: green-up               # green-up | red-up

aliases:                       # 公式、警报、对比、合成标的、搜索里可用的短名；搜索添加时的中文词也会记在这里
  SPY: yahoo:SPY
  QQQ: yahoo:QQQ
  NVDA: yahoo:NVDA
  HSI: yahoo:^HSI
  HSTECH: tv:HSI:HSTECH
  CSI300: tv:SSE:000300
  BTC: binance:BTCUSDT
  ETH: binance:ETHUSDT
  GOLD: tv:TVC:GOLD
  US10Y: tv:TVC:US10Y
  DXY: tv:TVC:DXY

groups:                        # 总览和图表右侧的自选按这个顺序显示，页面上拖动会改写这里的顺序
  - name: 美股
    symbols:
      - { key: SPY, name: 标普 500 }             # key：别名或完整 key；也可以只写一个字符串
      - { key: QQQ, name: 纳指 100, bench: SPY }  # bench：相对强弱、close(bench) 的默认基准
      - { key: NVDA, name: 英伟达, bench: QQQ }   # name 可省略：先用内置字典的中文名，再用数据源的名字
  - name: 宏观
    symbols:
      - { key: GOLD, name: 黄金 }
      - { key: US10Y, name: 美债 10 年 }
      - { key: DXY, name: 美元指数 }
  - name: 加密
    symbols:
      - { key: BTC, name: 比特币 }
      - { key: ETH, name: 以太坊, bench: BTC }
  - name: 港 A
    symbols:
      - { key: yahoo:0700.HK, name: 腾讯控股, bench: HSI }
      - { key: yahoo:600519.SS, name: 贵州茅台, bench: CSI300 }
  - name: 比价
    symbols:
      - { key: "=BTC/GOLD", name: 比特币/黄金 }   # 以 = 开头的是合成标的

indicators:                    # 公式指标，图表页可开关
  - { id: dev40, label: 均线乖离, pane: sub, formula: "(close / sma(close, 40) - 1) * 100" }
  - { id: vs_bench, label: 对基准比价, pane: sub, formula: "close / close(bench)" }

datasets: {}                   # 自定义数据集：名字 → git 地址或本机目录，key 写 data:名字/序列，见 docs/usage.md「自定义数据集」
#  gpu: https://github.com/you/gpu-prices

# 警报：总览「警报」列按你起的名字显示，触发时推到通知通道（~/.config/hebi8/market/notify.json 或页头「通知设置」）。
# 在图表顶栏「警报」或总览行菜单「添加警报…」里建，建好的就是下面这种写法。
# 写 key 的只看这个标的，盘中每 5 分钟取一次最新价判断：
#   cond：crossing 穿过 / crossing_up 上穿 / crossing_down 下穿 / greater 大于 / less 小于（value 是价格）
#         entering 进入通道 / exiting 离开通道 / inside 在通道内 / outside 在通道外（value 是 [低, 高]）
#         moving_up_pct 上涨 % / moving_down_pct 下跌 %（value 是 { pct, bars }）
#   trigger：once 仅一次（默认，触发后写成 enabled: false）/ bar 每根 K 线一次；也可以不写 cond，写 when 公式，tf 默认 D
# 不写 key 的对全部自选生效，每次日线同步后判断，在成立的标的上显示，只能用涨跌 % 或 when 公式
# check：判断时机。price 盘中价格（有 key 的默认）每次取到最新价都判断；close 日线收盘（没 key 的默认）只在同步后看已收盘的日线
# notify: false 只在总览显示、不推送
# agent 经 MCP（设置页「Agent 接入」）建的带 by: agent；它建的对全部自选的警报还带 draft: true，是待确认的草稿：
#   不判断也不推送，在页面上点「确认」（或者把 draft: true 这一项删掉）才生效，不想要就删掉整条
#   - { key: BTC, cond: crossing_up, value: 130000 }
#   - { key: SPY, cond: entering, value: [500, 520], trigger: bar }
#   - { key: NVDA, label: 跌破 200 日线, when: "close < sma(close, 200)" }
#   - { label: 周线多头, when: "close > sma(close, 40) and sma(close, 10) > sma(close, 40)", tf: W, notify: false }
#   - { label: 单日大涨, cond: moving_up_pct, value: { pct: 5, bars: 1 } }
#   - { label: 放量突破, when: "cross(close, highest(ref(high, 1), 50))", by: agent, draft: true }
alerts: []

chart:                         # 全局图表偏好（UI 改动会写回这里）
  tf: W                        # D | W | M | Q
  log: true
  style: candle_solid          # candle_solid | candle_up_stroke | ohlc | area
  indicators: [MA, VOL]        # 默认开启的指标名（内置 / 代码 / 公式 id）
  params:                      # 按周期覆盖指标参数；没写的用目录里的默认值
    W: { MA: [10, 40, 200] }
